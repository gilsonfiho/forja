<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}WorkG{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">⚙</span>
      <span>WorkG <small>Dev Workflow Copilot</small></span>
    </div>
    <div class="meta">
      <span class="pill">{{ specs|length }} agents</span>
      <span class="pill">v{{ version }}</span>
    </div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>
    <span>WorkG — orquestração de agents, skills e scripts.</span>
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
